<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoạt hình Ngụ ngôn: Con Cáo và Chùm Nho</title>
  <style>
    :root {
      --bg-sky: #E0F7FA;
      --bg-ground: #81C784;
      --fox-color: #FF8A65;
      --fox-dark: #D84315;
      --grape-color: #8E24AA;
      --grape-leaf: #388E3C;
      --bird-color: #FFF176;
      --text-color: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1a1a;
      font-family: 'Segoe UI', 'Arial', 'Helvetica Neue', 'Noto Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    #stage-wrap {
      width: 100%;
      max-width: 800px;
      padding: 10px;
    }

    #frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #111;
      border: 4px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: rgba(0,0,0,0.4);
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 15px;
    }

    #scene-tag {
      font-size: 14px;
      font-weight: bold;
      color: #FFD54F;
      white-space: nowrap;
    }

    #progress-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #4CAF50;
      transition: width 0.1s linear;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    svg text, text {
      font-family: 'Segoe UI', 'Arial', 'Helvetica Neue', 'Noto Sans', sans-serif;
    }

    #caption {
      position: absolute;
      bottom: 15px;
      left: 20px;
      right: 20px;
      text-align: center;
      z-index: 10;
    }

    #caption span {
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 15px;
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.2);
      display: inline-block;
      max-width: 90%;
    }

    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 0 5px;
    }

    .btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover { background: #555; }

    #timer {
      font-family: monospace;
      font-size: 14px;
      color: #aaa;
    }

    /* === ANIMATIONS CSS === */
    /* Chim bay trên bầu trời */
    @keyframes birdFly {
      0% { transform: translate(0, 0); }
      50% { transform: translate(40px, -15px); }
      100% { transform: translate(80px, 0); }
    }
    .anim-bird { animation: birdFly 3s infinite ease-in-out alternate; }

    /* Cáo đi dạo */
    @keyframes foxWalk {
      0% { transform: translateX(0); }
      100% { transform: translateX(180px); }
    }
    .anim-fox-walk { animation: foxWalk 7s forwards linear; }

    /* Đuôi cáo lắc lư */
    @keyframes tailWag {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
      100% { transform: rotate(0deg); }
    }
    .anim-tail { transform-origin: 190px 320px; animation: tailWag 1s infinite ease-in-out; }

    /* Nhảy lần 1 */
    @keyframes foxJump1 {
      0% { transform: translate(0, 0); }
      30% { transform: translate(0, 15px) scaleY(0.9); }
      60% { transform: translate(80px, -110px) scaleY(1.05); }
      85% { transform: translate(120px, 0) scaleY(0.95); }
      100% { transform: translate(120px, 0) scaleY(1); }
    }
    .anim-fox-jump1 { animation: foxJump1 4s forwards ease-in-out; }

    /* Nhảy lần 2 (Chạy đà và nhảy cao hơn) */
    @keyframes foxJump2 {
      0% { transform: translateX(0); }
      30% { transform: translateX(120px); }
      60% { transform: translate(220px, -140px); }
      80% { transform: translate(260px, 0); }
      100% { transform: translate(260px, 0); }
    }
    .anim-fox-jump2 { animation: foxJump2 5s forwards ease-out; }

    /* Thở dốc */
    @keyframes foxPants {
      0% { transform: scale(1); }
      50% { transform: scale(1.03, 0.97); }
      100% { transform: scale(1); }
    }
    .anim-fox-pant { transform-origin: 350px 330px; animation: foxPants 0.8s infinite ease-in-out; }

    /* Cáo quay lưng bỏ đi */
    @keyframes foxLeave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-200px); }
    }
    .anim-fox-leave { animation: foxLeave 6s forwards linear; }

    /* Chữ thông điệp hiện lên */
    @keyframes messageFade {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .anim-message { transform-origin: 400px 200px; animation: messageFade 1.5s forwards ease-out; }
  </style>
</head>
<body>

<div id="stage-wrap">
  <div id="frame">
    <div id="topbar">
      <div id="scene-tag">Cảnh 1/7</div>
      <div id="progress-track"><div id="progress-bar"></div></div>
    </div>

    <!-- SCENE 1 -->
    <div class="scene active" id="scene1">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="300" fill="var(--bg-sky)"/>
        <rect y="300" width="800" height="150" fill="var(--bg-ground)"/>
        <circle cx="700" cy="80" r="40" fill="#FFF59D"/>
        <!-- Cây cối bối cảnh -->
        <rect x="50" y="180" width="30" height="120" fill="#795548"/>
        <circle cx="65" cy="160" r="50" fill="#388E3C"/>
        <!-- Chim bay trên trời (Y=100) -->
        <g class="anim-bird">
          <path d="M 300 100 Q 315 85 330 100 Q 345 85 360 100" stroke="#333" stroke-width="4" fill="none"/>
        </g>
        <!-- Cáo đi dạo -->
        <g class="anim-fox-walk">
          <g class="character">
            <!-- Đuôi -->
            <path class="anim-tail" d="M 170 320 Q 130 300 150 270 Q 180 290 190 320" fill="var(--fox-dark)"/>
            <!-- Thân -->
            <ellipse cx="230" cy="320" rx="40" ry="20" fill="var(--fox-color)"/>
            <!-- Đầu -->
            <polygon points="260,305 300,315 260,325" fill="var(--fox-color)"/>
            <circle cx="290" cy="313" r="3" fill="#000"/>
            <polygon points="265,305 275,285 280,305" fill="var(--fox-dark)"/>
            <!-- Chân chạm đất Y=340 -->
            <line x1="205" y1="330" x2="205" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
            <line x1="220" y1="330" x2="220" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
            <line x1="240" y1="330" x2="240" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
            <line x1="255" y1="330" x2="255" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- SCENE 2 -->
    <div class="scene" id="scene2">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="300" fill="var(--bg-sky)"/>
        <rect y="300" width="800" height="150" fill="var(--bg-ground)"/>
        <!-- Giàn nho ở phải -->
        <rect x="550" y="100" width="200" height="20" fill="#5D4037"/>
        <rect x="700" y="120" width="20" height="180" fill="#5D4037"/>
        <!-- Chùm nho (Y=140 - 200) -->
        <g>
          <path d="M 610 115 Q 630 100 650 120" stroke="var(--grape-leaf)" stroke-width="8" fill="none"/>
          <circle cx="620" cy="140" r="12" fill="var(--grape-color)"/>
          <circle cx="640" cy="140" r="12" fill="var(--grape-color)"/>
          <circle cx="630" cy="160" r="12" fill="var(--grape-color)"/>
          <circle cx="650" cy="160" r="12" fill="var(--grape-color)"/>
          <circle cx="640" cy="180" r="12" fill="var(--grape-color)"/>
        </g>
        <!-- Cáo đứng nhìn (X=250) -->
        <g class="character" transform="translate(100, 0)">
          <ellipse cx="230" cy="320" rx="40" ry="20" fill="var(--fox-color)"/>
          <!-- Đầu ngước lên -->

          <circle cx="278" cy="280" r="4" fill="#000"/>
          <line x1="205" y1="330" x2="205" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
          <line x1="255" y1="330" x2="255" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
          <!-- Biểu cảm chảy nước dãi -->
          <path d="M 285 280 Q 290 295 288 300" stroke="#29B6F6" stroke-width="3" fill="none"/>
        </g>
      </svg>
    </div>

    <!-- SCENE 3 -->
    <div class="scene" id="scene3">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="300" fill="var(--bg-sky)"/>
        <rect y="300" width="800" height="150" fill="var(--bg-ground)"/>
        <!-- Giàn nho -->
        <rect x="550" y="100" width="200" height="20" fill="#5D4037"/>

          <circle cx="650" cy="160" r="12" fill="var(--grape-color)"/>

        </g>
        <!-- Cáo nhảy lần 1 -->
        <g class="anim-fox-jump1">
          <g class="character" transform="translate(250, 0)">
            <ellipse cx="230" cy="320" rx="35" ry="25" fill="var(--fox-color)"/>
            <polygon points="255,295 285,260 280,305" fill="var(--fox-color)"/>
            <circle cx="278" cy="275" r="4" fill="#000"/>
            <!-- Tay giơ lên -->
            <line x1="250" y1="310" x2="280" y2="280" stroke="var(--fox-dark)" stroke-width="5"/>
            <line x1="210" y1="330" x2="200" y2="350" stroke="var(--fox-dark)" stroke-width="6"/>
            <line x1="240" y1="330" x2="230" y2="350" stroke="var(--fox-dark)" stroke-width="6"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- SCENE 4 -->
    <div class="scene" id="scene4">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="300" fill="var(--bg-sky)"/>
        <rect y="300" width="800" height="150" fill="var(--bg-ground)"/>
        <!-- Giàn nho -->
        <rect x="550" y="100" width="200" height="20" fill="#5D4037"/>
        <rect x="700" y="120" width="20" height="180" fill="#5D4037"/>
        <g>
          <circle cx="620" cy="140" r="12" fill="var(--grape-color)"/>
          <circle cx="640" cy="140" r="12" fill="var(--grape-color)"/>
          <circle cx="630" cy="160" r="12" fill="var(--grape-color)"/>
          <circle cx="650" cy="160" r="12" fill="var(--grape-color)"/>
          <circle cx="640" cy="180" r="12" fill="var(--grape-color)"/>
        </g>
        <!-- Cáo lấy đà chạy & nhảy lần 2 -->
        <g class="anim-fox-jump2">
          <g class="character" transform="translate(150, 0)">

            <line x1="210" y1="330" x2="190" y2="350" stroke="var(--fox-dark)" stroke-width="6"/>
            <line x1="240" y1="330" x2="220" y2="350" stroke="var(--fox-dark)" stroke-width="6"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- SCENE 5 -->
    <div class="scene" id="scene5">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="300" fill="var(--bg-sky)"/>
        <rect y="300" width="800" height="150" fill="var(--bg-ground)"/>
        <!-- Giàn nho -->
        <rect x="550" y="100" width="200" height="20" fill="#5D4037"/>
        <rect x="700" y="120" width="20" height="180" fill="#5D4037"/>
        <g>
          <circle cx="620" cy="140" r="12" fill="var(--grape-color)"/>
          <circle cx="640" cy="140" r="12" fill="var(--grape-color)"/>
          <circle cx="630" cy="160" r="12" fill="var(--grape-color)"/>
          <circle cx="650" cy="160" r="12" fill="var(--grape-color)"/>
          <circle cx="640" cy="180" r="12" fill="var(--grape-color)"/>
        </g>
        <!-- Cáo nằm bệt thở dốc -->
        <g class="anim-fox-pant">
          <g class="character">
            <!-- Thân nằm trên đất Y=330 -->
            <ellipse cx="350" cy="335" rx="50" ry="15" fill="var(--fox-color)"/>
            <polygon points="390,325 425,335 390,345" fill="var(--fox-color)"/>
            <circle cx="410" cy="332" r="3" fill="#000"/>
            <line x1="320" y1="340" x2="300" y2="345" stroke="var(--fox-dark)" stroke-width="5"/>
            <line x1="370" y1="340" x2="385" y2="345" stroke="var(--fox-dark)" stroke-width="5"/>
            <!-- Giọt mồ hôi -->
            <path d="M 400 315 Q 405 305 403 300" stroke="#29B6F6" stroke-width="3" fill="none"/>
          </g>
        </g>
        <!-- Chim Sâu trên cành nhìn xuống -->
        <g transform="translate(560, 70)">
          <circle cx="0" cy="0" r="12" fill="var(--bird-color)"/>
          <polygon points="10,-2 20,0 10,5" fill="#FF9800"/>
          <circle cx="4" cy="-4" r="2" fill="#000"/>
        </g>
      </svg>
    </div>

    <!-- SCENE 6 -->
    <div class="scene" id="scene6">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="300" fill="var(--bg-sky)"/>
        <rect y="300" width="800" height="150" fill="var(--bg-ground)"/>
        <!-- Giàn nho -->
        <rect x="550" y="100" width="200" height="20" fill="#5D4037"/>
        <rect x="700" y="120" width="20" height="180" fill="#5D4037"/>
        <g>
          <circle cx="620" cy="140" r="12" fill="var(--grape-color)"/>
          <circle cx="640" cy="140" r="12" fill="var(--grape-color)"/>
          <circle cx="630" cy="160" r="12" fill="var(--grape-color)"/>
          <circle cx="650" cy="160" r="12" fill="var(--grape-color)"/>
          <circle cx="640" cy="180" r="12" fill="var(--grape-color)"/>
        </g>
        <!-- Cáo bĩu môi bỏ đi (quay mặt sang trái) -->
        <g class="anim-fox-leave">
          <g class="character" transform="translate(450, 0)">
            <ellipse cx="230" cy="320" rx="40" ry="20" fill="var(--fox-color)"/>
            <!-- Đầu quay sang trái -->
            <polygon points="200,305 160,315 200,325" fill="var(--fox-color)"/>
            <circle cx="175" cy="313" r="3" fill="#000"/>
            <line x1="205" y1="330" x2="205" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
            <line x1="220" y1="330" x2="220" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
            <line x1="240" y1="330" x2="240" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
            <line x1="255" y1="330" x2="255" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- SCENE 7: KẾT - THÔNG ĐIỆP -->
    <div class="scene" id="scene7">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="450" fill="#E8F5E9"/>
        <circle cx="400" cy="225" r="300" fill="#C8E6C9" opacity="0.5"/>
        <!-- Cáo & Chim vẫy chào -->
        <g class="character" transform="translate(180, 20)">
          <ellipse cx="230" cy="320" rx="35" ry="20" fill="var(--fox-color)"/>
          <polygon points="250,305 285,315 250,325" fill="var(--fox-color)"/>
          <circle cx="275" cy="313" r="3" fill="#000"/>
          <!-- Tay vẫy -->
          <line x1="240" y1="310" x2="250" y2="280" stroke="var(--fox-dark)" stroke-width="5"/>
          <line x1="210" y1="330" x2="210" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
          <line x1="240" y1="330" x2="240" y2="345" stroke="var(--fox-dark)" stroke-width="6"/>
        </g>
        <g transform="translate(520, 310)">
          <circle cx="0" cy="0" r="18" fill="var(--bird-color)"/>
          <polygon points="-12,-2 -22,0 -12,5" fill="#FF9800"/>
          <circle cx="-6" cy="-4" r="3" fill="#000"/>
        </g>
        <!-- Bảng thông điệp -->
        <g class="anim-message">
          <rect x="120" y="80" width="560" height="150" rx="20" fill="#2E7D32" stroke="#FFF" stroke-width="4"/>
          <text x="400" y="130" fill="#FFD54F" font-size="22" font-weight="bold" text-anchor="middle">BÀI HỌC BẢN LĨNH</text>
          <text x="400" y="170" fill="#FFFFFF" font-size="16" text-anchor="middle">Đừng chê "nho còn xanh" chỉ vì bản thân chưa đủ sức hái.</text>
          <text x="400" y="198" fill="#FFFFFF" font-size="16" text-anchor="middle">Hãy dũng cảm đối mặt với yếu điểm và kiên trì rèn luyện!</text>

    <div id="caption"><span id="caption-text">Đang tải...</span></div>

  <div id="controls">
    <button class="btn" id="btn-replay">⟲ Phát lại</button>
    <button class="btn" id="btn-play">⏸ Tạm dừng</button>
    <div id="timer">0.0s / 60.0s</div>
  </div>
</div>

<script>
  const TOTAL_TIME = 60;
  const scenes = [
    { id: 'scene1', start: 0, text: "Một ngày nắng đẹp, Cáo Tinh Tinh tung tăng dạo chơi trong khu rừng xanh mát." },
    { id: 'scene2', start: 8, text: "Bất ngờ, Cáo trông thấy một chùm nho chín mọng treo lơ lửng trên giàn cao." },
    { id: 'scene3', start: 16, text: "Thèm quá, Cáo nhún người lấy đà rồi nhảy thật cao! Nhưng chùm nho lại quá cao..." },
    { id: 'scene4', start: 25, text: "Không bỏ cuộc, Cáo lùi lại lấy đà chạy tới nhảy tiếp lần hai. Nhưng vẫn hụt!" },
    { id: 'scene5', start: 34, text: "Thử đi thử lại nhiều lần đến mệt bơ đờ, Cáo đành bất lực chịu thua." },
    { id: 'scene6', start: 43, text: "Để đỡ xấu hổ, Cáo bèn tự nhủ: 'Chắc nho này còn xanh và chua lắm!' rồi bỏ đi." },
    { id: 'scene7', start: 52, text: "Đừng tự dối lòng khi chưa đạt mục tiêu. Hãy dũng cảm cố gắng rèn luyện mỗi ngày!" }
  ];

  let currentTime = 0;
  let isPlaying = true;
  let lastTimestamp = null;
  let currentSceneIndex = 0;

  const progressBar = document.getElementById('progress-bar');
  const timerDisplay = document.getElementById('timer');
  const sceneTag = document.getElementById('scene-tag');
  const captionText = document.getElementById('caption-text');
  const btnPlay = document.getElementById('btn-play');
  const btnReplay = document.getElementById('btn-replay');

  function updateTimeline(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    if (isPlaying) {
      currentTime += delta;
      if (currentTime >= TOTAL_TIME) {
        currentTime = TOTAL_TIME;
        isPlaying = false;
        btnPlay.textContent = '▶ Tiếp tục';
      }
    }

    // Render UI
    progressBar.style.width = `${(currentTime / TOTAL_TIME) * 100}%`;
    timerDisplay.textContent = `${currentTime.toFixed(1)}s / ${TOTAL_TIME}.0s`;

    // Cập nhật Cảnh active
    let activeIdx = 0;
    for (let i = scenes.length - 1; i >= 0; i--) {
      if (currentTime >= scenes[i].start) {
        activeIdx = i;
        break;
      }
    }

    if (activeIdx !== currentSceneIndex || currentTime === 0) {
      document.querySelectorAll('.scene').forEach((el, idx) => {
        el.classList.toggle('active', idx === activeIdx);
      });
      currentSceneIndex = activeIdx;
      sceneTag.textContent = `Cảnh ${activeIdx + 1}/${scenes.length}`;
      captionText.textContent = scenes[activeIdx].text;
    }

    requestAnimationFrame(updateTimeline);
  }

  btnPlay.addEventListener('click', () => {
    isPlaying = !isPlaying;
    btnPlay.textContent = isPlaying ? '⏸ Tạm dừng' : '▶ Tiếp tục';
    lastTimestamp = performance.now();
  });

  btnReplay.addEventListener('click', () => {
    currentTime = 0;
    isPlaying = true;
    btnPlay.textContent = '⏸ Tạm dừng';
    lastTimestamp = performance.now();
  });

  // Khởi chạy
  requestAnimationFrame(updateTimeline);
