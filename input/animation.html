<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chú Vịt Con Xấu Xí - Hoạt hình</title>
<style>
  :root{
    --grey1:#2b2f33; --grey2:#4a5459; --grey3:#6b7b7f;
    --warm1:#fff3d6; --warm2:#ffd88a; --warm3:#ff9d3c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#000; font-family:'Segoe UI',Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:20px; color:#fdf6ec;
  }
  /* #frame = the pure visual canvas, NO text/UI inside it except final message scene */
  #frame{
    position:relative; width:100%; max-width:960px;
    aspect-ratio:16/9; border-radius:12px; overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    background:#1a1e22;
  }
  .scene{
    position:absolute; inset:0; opacity:0; transition:opacity 0.8s ease;
    pointer-events:none;
  }
  .scene.active{ opacity:1; }
  .scene svg{ width:100%; height:100%; display:block; }
  .flake{ fill:#eaf3ff; opacity:0.8; }

  /* Only scene 9 (final message) is allowed on-screen text, rendered inside its own SVG */

  /* ---- Controls OUTSIDE #frame ---- */
  #controls{
    width:100%; max-width:960px; margin-top:14px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  button{
    background:var(--warm3); color:#1a1a1a; border:none; padding:10px 18px;
    border-radius:20px; font-weight:700; cursor:pointer; font-size:14px;
    transition:transform 0.15s;
  }
  button:hover{ transform:scale(1.05); }
  #progress-track{
    flex:1; height:8px; background:#2a2a2a; border-radius:4px; overflow:hidden;
    min-width:150px;
  }
  #progress-bar{ height:100%; width:0%; background:linear-gradient(90deg,var(--warm2),var(--warm3)); }
  #time-label{ font-size:13px; opacity:0.8; min-width:70px; text-align:right; }
  #scene-counter{ font-size:12px; opacity:0.6; margin-top:8px; }
</style>
</head>
<body>

<div id="frame">

  <!-- CẢNH 1: Chào đời khác biệt -->
  <div class="scene" id="s1">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="url(#g1)"/>
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#bcd8ea"/><stop offset="100%" stop-color="#e8f2f8"/>
      </linearGradient></defs>
      <!-- pond ground -->
      <ellipse cx="400" cy="380" rx="420" ry="70" fill="#8fb84c"/>
      <ellipse cx="400" cy="400" rx="260" ry="40" fill="#6ea3c9"/>
      <!-- nest -->
      <ellipse cx="400" cy="345" rx="140" ry="35" fill="#a9803f"/>
      <ellipse cx="400" cy="335" rx="120" ry="26" fill="#c79a54"/>
      <!-- yellow ducklings hatched, sitting y~320-335 -->
      <circle cx="330" cy="322" r="16" fill="#f4d35e"/>
      <circle cx="330" cy="308" r="10" fill="#f4d35e"/>
      <circle cx="470" cy="325" r="16" fill="#f4d35e"/>
      <circle cx="470" cy="311" r="10" fill="#f4d35e"/>
      <!-- big grey duckling emerging center, feet ~335 -->
      <g id="uglyduck1">
        <ellipse cx="400" cy="333" rx="26" ry="6" fill="#0003"/>
        <ellipse cx="400" cy="308" rx="30" ry="24" fill="#7a7a72"/>
        <circle cx="400" cy="278" r="16" fill="#8a8a80"/>
        <polygon points="412,278 428,282 412,286" fill="#e0a83f"/>
      </g>
      <!-- broken shell pieces -->
      <path d="M370 300 Q360 285 375 280 Q380 295 370 300" fill="#e8e2c8"/>
      <path d="M430 300 Q445 285 440 280 Q425 290 430 300" fill="#e8e2c8"/>
    </svg>
  </div>

  <!-- CẢNH 2: Bị chế giễu -->
  <div class="scene" id="s2">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="#dce8ef"/>
      <ellipse cx="400" cy="380" rx="420" ry="70" fill="#8fb84c"/>
      <!-- circle of mocking animals around center, ground y~335-345 -->
      <g><ellipse cx="220" cy="340" rx="14" ry="5" fill="#0002"/><ellipse cx="220" cy="322" rx="18" ry="16" fill="#f4d35e"/><circle cx="220" cy="300" r="11" fill="#f4d35e"/></g>
      <g><ellipse cx="580" cy="340" rx="14" ry="5" fill="#0002"/><ellipse cx="580" cy="322" rx="18" ry="16" fill="#f4d35e"/><circle cx="580" cy="300" r="11" fill="#f4d35e"/></g>
      <g><ellipse cx="300" cy="345" rx="16" ry="5" fill="#0002"/><ellipse cx="300" cy="325" rx="22" ry="18" fill="#e8e8e8"/><circle cx="300" cy="298" r="12" fill="#e8e8e8"/><polygon points="312,298 330,302 312,306" fill="#e0663f"/></g>
      <g><ellipse cx="500" cy="345" rx="16" ry="5" fill="#0002"/><ellipse cx="500" cy="325" rx="22" ry="18" fill="#eeeeee"/><circle cx="500" cy="298" r="12" fill="#eeeeee"/></g>
      <!-- ugly duckling cowering center, head down -->
      <g id="uglyduck2">
        <ellipse cx="400" cy="345" rx="28" ry="7" fill="#0004"/>
        <ellipse cx="400" cy="320" rx="30" ry="24" fill="#6b6b62"/>
        <circle cx="400" cy="298" r="15" fill="#7a7a70"/>
      </g>
    </svg>
  </div>

  <!-- CẢNH 3: Rời bỏ trang trại -->
  <div class="scene" id="s3">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="url(#g3)"/>
      <defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#141d2e"/><stop offset="100%" stop-color="#2a3a52"/>
      </linearGradient></defs>
      <circle cx="680" cy="90" r="40" fill="#e8ecd8" opacity="0.9"/>
      <rect x="0" y="340" width="800" height="110" fill="#1e2b22"/>
      <!-- gate silhouette -->
      <rect x="330" y="200" width="14" height="150" fill="#0d1410"/>
      <rect x="456" y="200" width="14" height="150" fill="#0d1410"/>
      <rect x="330" y="200" width="140" height="12" fill="#0d1410"/>
      <!-- ugly duckling walking away, feet ~340 -->
      <g id="uglyduck3">
        <ellipse cx="400" cy="338" rx="24" ry="6" fill="#0005"/>
        <ellipse cx="400" cy="315" rx="26" ry="20" fill="#484843"/>
        <circle cx="400" cy="295" r="13" fill="#565650"/>
      </g>
      <g class="flake" opacity="0.4"><circle cx="120" cy="80" r="2"/><circle cx="220" cy="140" r="2"/><circle cx="600" cy="180" r="2"/></g>
    </svg>
  </div>

  <!-- CẢNH 4: Bị đàn ngỗng hoang xua đuổi -->
  <div class="scene" id="s4">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="url(#g4)"/>
      <defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5c6b5c"/><stop offset="100%" stop-color="#8a9a7a"/>
      </linearGradient></defs>
      <ellipse cx="400" cy="390" rx="440" ry="65" fill="#4a6b8a"/>
      <ellipse cx="180" cy="345" rx="14" ry="20" fill="#3a4a3a" opacity="0.5"/>
      <ellipse cx="650" cy="345" rx="14" ry="20" fill="#3a4a3a" opacity="0.5"/>
      <!-- wild geese, wings up, threatening, y ~300-335 -->
      <g><ellipse cx="260" cy="335" rx="20" ry="8" fill="#0003"/><ellipse cx="260" cy="310" rx="24" ry="20" fill="#5a5a52"/><circle cx="260" cy="286" r="13" fill="#666"/><path d="M240 300 L210 280 L245 295Z" fill="#4a4a44"/></g>
      <g><ellipse cx="330" cy="330" rx="20" ry="8" fill="#0003"/><ellipse cx="330" cy="305" rx="24" ry="20" fill="#5a5a52"/><circle cx="330" cy="281" r="13" fill="#666"/></g>
      <!-- ugly duckling fleeing right, feet ~335 -->
      <g id="uglyduck4">
        <ellipse cx="520" cy="335" rx="24" ry="6" fill="#0004"/>
        <ellipse cx="520" cy="312" rx="26" ry="20" fill="#5a5a52"/>
        <circle cx="520" cy="292" r="13" fill="#666"/>
      </g>
    </svg>
  </div>

  <!-- CẢNH 5: Túp lều bà lão -->
  <div class="scene" id="s5">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="#3a3228"/>
      <rect x="0" y="340" width="800" height="110" fill="#2a2018"/>
      <!-- hut interior hint -->
      <rect x="60" y="120" width="680" height="220" fill="#4a3f30"/>
      <rect x="100" y="250" width="120" height="90" fill="#2f261c"/>
      <!-- cat -->
      <g><ellipse cx="600" cy="330" rx="26" ry="8" fill="#0004"/><ellipse cx="600" cy="308" rx="24" ry="18" fill="#333"/><circle cx="600" cy="286" r="13" fill="#3a3a3a"/><polygon points="590,278 585,264 596,276" fill="#3a3a3a"/><polygon points="610,278 615,264 604,276" fill="#3a3a3a"/></g>
      <!-- hen -->
      <g><ellipse cx="500" cy="332" rx="18" ry="6" fill="#0004"/><ellipse cx="500" cy="315" rx="20" ry="16" fill="#b5623a"/><circle cx="500" cy="296" r="11" fill="#c06e44"/></g>
      <!-- ugly duckling small, hunched, feet~335 -->
      <g id="uglyduck5">
        <ellipse cx="330" cy="335" rx="24" ry="6" fill="#0005"/>
        <ellipse cx="330" cy="313" rx="26" ry="20" fill="#4f4f47"/>
        <circle cx="330" cy="294" r="13" fill="#5a5a50"/>
      </g>
    </svg>
  </div>

  <!-- CẢNH 6: Mùa đông cô độc -->
  <div class="scene" id="s6">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="url(#g6)"/>
      <defs><linearGradient id="g6" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c7d9e8"/><stop offset="100%" stop-color="#eef5fa"/>
      </linearGradient></defs>
      <ellipse cx="400" cy="380" rx="440" ry="70" fill="#dce8f0"/>
      <ellipse cx="400" cy="360" rx="260" ry="30" fill="#b7cfe0"/>
      <g id="uglyduck6">
        <ellipse cx="400" cy="358" rx="22" ry="6" fill="#0002"/>
        <ellipse cx="400" cy="340" rx="24" ry="18" fill="#57574f"/>
        <circle cx="400" cy="322" r="12" fill="#63635a"/>
      </g>
      <g class="flake"><circle cx="90" cy="60" r="3"/><circle cx="200" cy="110" r="2"/><circle cx="330" cy="50" r="3"/>
      <circle cx="470" cy="90" r="2"/><circle cx="600" cy="40" r="3"/><circle cx="710" cy="120" r="2"/>
      <circle cx="150" cy="200" r="2"/><circle cx="620" cy="180" r="2"/><circle cx="260" cy="160" r="2"/></g>
    </svg>
  </div>

  <!-- CẢNH 7: Đàn thiên nga tuyệt đẹp -->
  <div class="scene" id="s7">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="url(#g7)"/>
      <defs><linearGradient id="g7" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#bfe3d8"/><stop offset="100%" stop-color="#eaf7ee"/>
      </linearGradient></defs>
      <ellipse cx="400" cy="380" rx="440" ry="70" fill="#a9d6c9"/>
      <!-- swans gliding, y ~ 310-335 -->
      <g><ellipse cx="560" cy="335" rx="22" ry="7" fill="#0001"/><ellipse cx="560" cy="318" rx="26" ry="16" fill="#fff"/><path d="M560 305 Q575 275 585 300" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/></g>
      <g><ellipse cx="640" cy="332" rx="20" ry="6" fill="#0001"/><ellipse cx="640" cy="316" rx="22" ry="14" fill="#fff"/><path d="M640 305 Q652 280 660 300" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></g>
      <!-- ugly duckling approaching timidly, feet ~335 -->
      <g id="uglyduck7">
        <ellipse cx="300" cy="335" rx="24" ry="6" fill="#0003"/>
        <ellipse cx="300" cy="316" rx="26" ry="20" fill="#57574f"/>
        <circle cx="300" cy="296" r="13" fill="#63635a"/>
      </g>
    </svg>
  </div>

  <!-- CẢNH 8: Nhận ra chính mình -->
  <div class="scene" id="s8">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="url(#g8)"/>
      <defs><linearGradient id="g8" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fdf3d0"/><stop offset="100%" stop-color="#fff9ea"/>
      </linearGradient></defs>
      <ellipse cx="400" cy="380" rx="440" ry="70" fill="#f2e2a8"/>
      <ellipse cx="400" cy="360" rx="200" ry="26" fill="#e9d488" opacity="0.7"/>
      <!-- swan body above water, y~300-335 -->
      <g id="swan8">
        <ellipse cx="400" cy="333" rx="26" ry="8" fill="#0001"/>
        <ellipse cx="400" cy="312" rx="30" ry="20" fill="#ffffff"/>
        <path d="M400 300 Q418 265 432 292" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
        <polygon points="428,290 442,286 432,298" fill="#e0a83f"/>
      </g>
      <!-- reflection of swan below water (mirrored, real form) -->
      <g id="reflection8" transform="translate(0,720) scale(1,-1)" opacity="0.55">
        <ellipse cx="400" cy="333" rx="26" ry="8" fill="#0001"/>
        <ellipse cx="400" cy="312" rx="30" ry="20" fill="#ffffff"/>
        <path d="M400 300 Q418 265 432 292" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- CẢNH 9: KẾT - THÔNG ĐIỆP (duy nhất được phép có chữ) -->
  <div class="scene" id="s9">
    <svg viewBox="0 0 800 450">
      <rect width="800" height="450" fill="url(#g9)"/>
      <defs><radialGradient id="g9" cx="50%" cy="45%" r="80%">
        <stop offset="0%" stop-color="#fff7e0"/><stop offset="55%" stop-color="#ffd88a"/><stop offset="100%" stop-color="#ff9d3c"/>
      </radialGradient></defs>
      <ellipse cx="400" cy="380" rx="440" ry="70" fill="#ffedb8" opacity="0.8"/>
      <!-- flying swans silhouette, elevated but composition allows artistic exception for flight -->
      <g fill="#fff">
        <path d="M300 260 Q320 235 340 258 Q360 235 380 258" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M420 240 Q440 215 460 238 Q480 215 500 238" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>
      <text x="400" y="360" text-anchor="middle" font-size="26" fill="#5a3a12" font-family="Georgia,serif" font-style="italic" font-weight="bold">
        <tspan x="400" dy="0">Vẻ đẹp thật sự cần thời gian để nở rộ.</tspan>
        <tspan x="400" dy="36">Đừng để ánh mắt người khác</tspan>
        <tspan x="400" dy="36">định nghĩa giá trị của chính bạn.</tspan>
      </text>
    </svg>
  </div>

</div>

<div id="controls">
  <button id="playBtn">⏸ Tạm dừng</button>
  <button id="restartBtn">⟲ Phát lại</button>
  <div id="progress-track"><div id="progress-bar"></div></div>
  <div id="time-label">0:00 / 2:05</div>
</div>
<div id="scene-counter">Cảnh: <span id="scene-num">1 / 9</span></div>

<script>
(function(){
  const scenes = [
    {id:'s1', dur:12},
    {id:'s2', dur:14},
    {id:'s3', dur:13},
    {id:'s4', dur:14},
    {id:'s5', dur:14},
    {id:'s6', dur:15},
    {id:'s7', dur:15},
    {id:'s8', dur:14},
    {id:'s9', dur:14}
  ];
  const TOTAL = scenes.reduce((a,s)=>a+s.dur,0); // 125s

  let currentIndex = 0;
  let elapsed = 0;
  let playing = true;
  let lastTs = null;

  const els = scenes.map(s => document.getElementById(s.id));
  const progressBar = document.getElementById('progress-bar');
  const timeLabel = document.getElementById('time-label');
  const sceneNum = document.getElementById('scene-num');
  const playBtn = document.getElementById('playBtn');
  const restartBtn = document.getElementById('restartBtn');

  function showScene(i){
    els.forEach((el,idx)=> el.classList.toggle('active', idx===i));
    sceneNum.textContent = (i+1) + ' / ' + scenes.length;
  }

  function fmt(t){
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ':' + (s<10?'0':'') + s;
  }

  showScene(0);

  function tick(ts){
    if(!playing){ lastTs = null; requestAnimationFrame(tick); return; }
    if(lastTs === null) lastTs = ts;
    const dt = (ts - lastTs)/1000;
    lastTs = ts;

    elapsed += dt;
    let sceneElapsed = elapsed;
    let idx = 0;
    for(; idx < scenes.length; idx++){
      if(sceneElapsed < scenes[idx].dur) break;
      sceneElapsed -= scenes[idx].dur;
    }
    if(idx >= scenes.length){
      idx = scenes.length - 1;
      elapsed = TOTAL;
      playing = false;
      playBtn.textContent = '▶ Phát';
    }
    if(idx !== currentIndex){
      currentIndex = idx;
      showScene(currentIndex);
    }
    progressBar.style.width = (Math.min(elapsed,TOTAL)/TOTAL*100) + '%';
    timeLabel.textContent = fmt(Math.min(elapsed,TOTAL)) + ' / ' + fmt(TOTAL);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  playBtn.addEventListener('click', ()=>{
    playing = !playing;
    playBtn.textContent = playing ? '⏸ Tạm dừng' : '▶ Phát';
    if(playing) lastTs = null;
  });

  restartBtn.addEventListener('click', ()=>{
    elapsed = 0; currentIndex = 0; showScene(0); playing = true; lastTs = null;
    playBtn.textContent = '⏸ Tạm dừng';
  });
})();
</script>

</body>
</html>
