<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoạt hình: Hòn Đá Trên Đường</title>
  <style>
    :root {
      --bg-sky: #E0F2F1;
      --bg-ground: #81C784;
      --road-color: #D7CCC8;
      --rock-color: #78909C;
      --gold-color: #FFD54F;
      --farmer-color: #8D6E63;
      --merchant-color: #5C6BC0;
      --scholar-color: #26A69A;
      --text-color: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #121212;
      font-family: 'Segoe UI', 'Arial', 'Helvetica Neue', 'Noto Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    #stage-wrap {
      width: 100%;
      max-width: 800px;
      padding: 10px;
    }

    #frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #111;
      border: 4px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: rgba(0,0,0,0.5);
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 15px;
    }

    #scene-tag {
      font-size: 14px;
      font-weight: bold;
      color: #FFD54F;
      white-space: nowrap;
    }

    #progress-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #4CAF50;
      transition: width 0.1s linear;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    svg text, text {
      font-family: 'Segoe UI', 'Arial', 'Helvetica Neue', 'Noto Sans', sans-serif;
    }

    #caption {
      position: absolute;
      bottom: 12px;
      left: 20px;
      right: 20px;
      text-align: center;
      z-index: 10;
    }

    #caption span {
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.2);
      display: inline-block;
      max-width: 90%;
    }

    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 0 5px;
    }

    .btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover { background: #555; }

    #timer {
      font-family: monospace;
      font-size: 14px;
      color: #aaa;
    }

    /* === KEYFRAMES ANIMATIONS === */
    @keyframes walkRight {
      0% { transform: translateX(0); }
      100% { transform: translateX(180px); }
    }
    .anim-walk { animation: walkRight 10s forwards linear; }

    @keyframes pushRock {
      0% { transform: translateX(0); }
      100% { transform: translateX(90px); }
    }
    .anim-push-rock { animation: pushRock 8s forwards ease-out; }

    @keyframes goldGlow {
      0% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    .anim-glow { transform-origin: 400px 325px; animation: goldGlow 2s infinite ease-in-out; }

    @keyframes msgAppear {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .anim-msg { transform-origin: 400px 180px; animation: msgAppear 1.2s forwards ease-out; }
  </style>
</head>
<body>

<div id="stage-wrap">
  <div id="frame">
    <div id="topbar">
      <div id="scene-tag">Cảnh 1/12</div>
      <div id="progress-track"><div id="progress-bar"></div></div>
    </div>

    <!-- SCENE 1 -->
    <div class="scene active" id="scene1">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <!-- Hòn đá -->
        <path d="M 370 330 Q 400 290 430 330 Q 420 350 380 345 Z" fill="var(--rock-color)"/>
        <!-- Bóng người ẩn sau cây -->
        <circle cx="700" cy="240" r="40" fill="#388E3C"/>
        <rect x="695" y="280" width="10" height="50" fill="#5D4037"/>
        <circle cx="680" cy="270" r="10" fill="#333"/>
      </svg>
    </div>

    <!-- SCENE 2 -->
    <div class="scene" id="scene2">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <path d="M 370 330 Q 400 290 430 330 Q 420 350 380 345 Z" fill="var(--rock-color)"/>
        <!-- Thương gia An -->
        <g class="anim-walk">
          <g class="character" transform="translate(100, 0)">
            <circle cx="100" cy="270" r="12" fill="#FFE0B2"/>
            <rect x="92" y="282" width="16" height="35" fill="var(--merchant-color)"/>
            <line x1="95" y1="317" x2="95" y2="340" stroke="#000" stroke-width="4"/>
            <line x1="105" y1="317" x2="105" y2="340" stroke="#000" stroke-width="4"/>
            <circle cx="115" cy="285" r="6" fill="var(--gold-color)"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- SCENE 3 -->
    <div class="scene" id="scene3">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <path d="M 370 330 Q 400 290 430 330 Q 420 350 380 345 Z" fill="var(--rock-color)"/>
        <!-- Thương gia càm ràm né đá -->
        <g class="character" transform="translate(280, -10)">
          <circle cx="100" cy="270" r="12" fill="#FFE0B2"/>
          <rect x="92" y="282" width="16" height="35" fill="var(--merchant-color)"/>
          <line x1="95" y1="317" x2="90" y2="340" stroke="#000" stroke-width="4"/>
          <line x1="105" y1="317" x2="110" y2="340" stroke="#000" stroke-width="4"/>
          <path d="M 80 260 L 70 250" stroke="#FF5722" stroke-width="3"/>
        </g>
      </svg>
    </div>

    <!-- SCENE 4 -->
    <div class="scene" id="scene4">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <path d="M 370 330 Q 400 290 430 330 Q 420 350 380 345 Z" fill="var(--rock-color)"/>
        <!-- Học giả Bình -->
        <g class="anim-walk">
          <g class="character" transform="translate(80, 0)">
            <circle cx="100" cy="270" r="12" fill="#FFE0B2"/>
            <rect x="92" y="282" width="16" height="35" fill="var(--scholar-color)"/>
            <line x1="95" y1="317" x2="95" y2="340" stroke="#000" stroke-width="4"/>
            <line x1="105" y1="317" x2="105" y2="340" stroke="#000" stroke-width="4"/>
            <rect x="108" y="285" width="10" height="12" fill="#FFF" stroke="#000"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- SCENE 5 -->
    <div class="scene" id="scene5">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <path d="M 370 330 Q 400 290 430 330 Q 420 350 380 345 Z" fill="var(--rock-color)"/>
        <!-- Học giả đứng lắc đầu -->
        <g class="character" transform="translate(260, 0)">
          <circle cx="100" cy="270" r="12" fill="#FFE0B2"/>
          <rect x="92" y="282" width="16" height="35" fill="var(--scholar-color)"/>
          <line x1="95" y1="317" x2="95" y2="340" stroke="#000" stroke-width="4"/>
          <line x1="105" y1="317" x2="105" y2="340" stroke="#000" stroke-width="4"/>
          <text x="85" y="250" fill="#333" font-size="12">Thật vô ý thức!</text>
        </g>
      </svg>
    </div>

    <!-- SCENE 6 -->
    <div class="scene" id="scene6">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <path d="M 370 330 Q 400 290 430 330 Q 420 350 380 345 Z" fill="var(--rock-color)"/>
        <!-- Nông dân Tâm vác gánh -->
        <g class="anim-walk">
          <g class="character" transform="translate(60, 0)">
            <circle cx="100" cy="270" r="12" fill="#FFE0B2"/>
            <rect x="92" y="282" width="16" height="35" fill="var(--farmer-color)"/>
            <line x1="95" y1="317" x2="95" y2="340" stroke="#000" stroke-width="4"/>
            <line x1="105" y1="317" x2="105" y2="340" stroke="#000" stroke-width="4"/>
            <!-- Gánh rau -->
            <line x1="70" y1="280" x2="130" y2="280" stroke="#5D4037" stroke-width="3"/>
            <circle cx="70" cy="295" r="12" fill="#4CAF50"/>
            <circle cx="130" cy="295" r="12" fill="#4CAF50"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- SCENE 7 -->
    <div class="scene" id="scene7">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <path d="M 370 330 Q 400 290 430 330 Q 420 350 380 345 Z" fill="var(--rock-color)"/>
        <!-- Nông dân hạ gánh rau -->
        <g class="character" transform="translate(240, 0)">
          <circle cx="100" cy="270" r="12" fill="#FFE0B2"/>
          <rect x="92" y="282" width="16" height="35" fill="var(--farmer-color)"/>
          <line x1="95" y1="317" x2="95" y2="340" stroke="#000" stroke-width="4"/>
          <line x1="105" y1="317" x2="105" y2="340" stroke="#000" stroke-width="4"/>
          <!-- Gánh rau để dưới đất -->
          <line x1="30" y1="325" x2="70" y2="325" stroke="#5D4037" stroke-width="3"/>
          <circle cx="30" cy="335" r="10" fill="#4CAF50"/>
          <circle cx="70" cy="335" r="10" fill="#4CAF50"/>
        </g>
      </svg>
    </div>

    <!-- SCENE 8 -->
    <div class="scene" id="scene8">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <!-- Nông dân đẩy hòn đá -->
        <g class="anim-push-rock">
          <path d="M 370 330 Q 400 290 430 330 Q 420 350 380 345 Z" fill="var(--rock-color)"/>
        </g>
        <g class="character" transform="translate(250, 0)">
          <circle cx="100" cy="275" r="12" fill="#FFE0B2"/>
          <rect x="92" y="285" width="16" height="32" fill="var(--farmer-color)"/>
          <line x1="100" y1="290" x2="120" y2="300" stroke="var(--farmer-color)" stroke-width="6"/>
          <line x1="95" y1="317" x2="88" y2="340" stroke="#000" stroke-width="4"/>
          <line x1="105" y1="317" x2="112" y2="340" stroke="#000" stroke-width="4"/>
        </g>
      </svg>
    </div>

    <!-- SCENE 9 -->
    <div class="scene" id="scene9">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <!-- Hòn đá đã dời -->
        <path d="M 480 330 Q 510 290 540 330 Q 530 350 490 345 Z" fill="var(--rock-color)"/>
        <!-- Cái hố & túi phát sáng -->
        <ellipse cx="400" cy="335" rx="25" ry="8" fill="#4E342E"/>
        <g class="anim-glow">
          <path d="M 390 320 Q 400 305 410 320 Q 415 335 385 335 Z" fill="var(--gold-color)"/>
        </g>
      </svg>
    </div>

    <!-- SCENE 10 -->
    <div class="scene" id="scene10">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <!-- Nông dân mở thư -->
        <g class="character" transform="translate(300, -20)">
          <circle cx="100" cy="270" r="12" fill="#FFE0B2"/>
          <rect x="92" y="282" width="16" height="35" fill="var(--farmer-color)"/>
          <rect x="110" y="275" width="25" height="18" fill="#FFF8E1" stroke="#333"/>
          <line x1="95" y1="317" x2="95" y2="340" stroke="#000" stroke-width="4"/>
          <line x1="105" y1="317" x2="105" y2="340" stroke="#000" stroke-width="4"/>
        </g>
      </svg>
    </div>

    <!-- SCENE 11 -->
    <div class="scene" id="scene11">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="280" fill="var(--bg-sky)"/>
        <rect y="280" width="800" height="170" fill="var(--bg-ground)"/>
        <path d="M 0 340 Q 400 300 800 340 L 800 450 L 0 450 Z" fill="var(--road-color)"/>
        <!-- Nông dân vui vẻ vác gánh đi tiếp -->
        <g class="character" transform="translate(500, 0)">
          <circle cx="100" cy="270" r="12" fill="#FFE0B2"/>
          <rect x="92" y="282" width="16" height="35" fill="var(--farmer-color)"/>
          <line x1="95" y1="317" x2="95" y2="340" stroke="#000" stroke-width="4"/>
          <line x1="105" y1="317" x2="105" y2="340" stroke="#000" stroke-width="4"/>
        </g>
        <!-- Thương gia & Học giả đứng tiếc nuối -->
        <g class="character" transform="translate(100, 0)">
          <circle cx="80" cy="270" r="10" fill="#FFE0B2"/>
          <rect x="74" y="280" width="12" height="30" fill="var(--merchant-color)"/>
          <circle cx="110" cy="270" r="10" fill="#FFE0B2"/>
          <rect x="104" y="280" width="12" height="30" fill="var(--scholar-color)"/>
        </g>
      </svg>
    </div>

    <!-- SCENE 12: KẾT THÔNG ĐIỆP -->
    <div class="scene" id="scene12">
      <svg viewBox="0 0 800 450">
        <rect width="800" height="450" fill="#E8F5E9"/>
        <circle cx="400" cy="225" r="280" fill="#C8E6C9" opacity="0.6"/>
        <g class="anim-msg">
          <rect x="100" y="100" width="600" height="160" rx="20" fill="#2E7D32" stroke="#FFF" stroke-width="4"/>
          <text x="400" y="150" fill="#FFD54F" font-size="22" font-weight="bold" text-anchor="middle">BÀI HỌC VỀ CƠ HỘI</text>
          <text x="400" y="190" fill="#FFFFFF" font-size="16" text-anchor="middle">Mọi chướng ngại vật đều ẩn chứa cơ hội để phát triển.</text>
          <text x="400" y="220" fill="#FFFFFF" font-size="16" text-anchor="middle">Hãy ngừng than phiền và chủ động tạo ra giá trị cho cộng đồng!</text>
        </g>
      </svg>
    </div>

    <div id="caption"><span id="caption-text">Đang tải kịch bản...</span></div>
  </div>

  <div id="controls">
    <button class="btn" id="btn-replay">⟲ Phát lại</button>
    <button class="btn" id="btn-play">⏸ Tạm dừng</button>
    <div id="timer">0.0s / 120.0s</div>
  </div>
</div>

<script>
  const TOTAL_TIME = 120;
  const scenes = [
    { id: 'scene1', start: 0, text: "Một vị vua bí mật đặt một hòn đá to giữa đường để thử lòng dân chúng." },
    { id: 'scene2', start: 10, text: "Người đầu tiên đi qua là một thương gia giàu có đang bận rộn tính toán lợi nhuận." },
    { id: 'scene3', start: 20, text: "Thương gia bĩu môi phàn nàn rồi thản nhiên đi vòng qua hòn đá." },
    { id: 'scene4', start: 30, text: "Tiếp theo là một học giả tri thức luôn tự hào về sự hiểu biết của mình." },
    { id: 'scene5', start: 40, text: "Ông đứng chê bai sự thiếu ý thức của người khác rồi cũng ngoảnh mặt bỏ đi." },
    { id: 'scene6', start: 50, text: "Mặt trời lên cao, bác nông dân nghèo vác gánh rau nặng nhọc tiến tới." },
    { id: 'scene7', start: 60, text: "Lo cho người sau bị vấp ngã, bác quyết định hạ gánh rau xuống để dọn đường." },
    { id: 'scene8', start: 70, text: "Dùng hết sức lực còn lại, bác gồng mình dời hòn đá vào mép đường." },
    { id: 'scene9', start: 80, text: "Khi hòn đá dịch chuyển, một chiếc túi lấp lánh xuất hiện ngay bên dưới." },
    { id: 'scene10', start: 90, text: "Bên trong chiếc túi chứa đầy đồng vàng cùng lời khen ngợi từ nhà vua." },
    { id: 'scene11', start: 100, text: "Bác nông dân vui vẻ đi tiếp, để lại bài học sâu sắc cho những người đứng nhìn." },
    { id: 'scene12', start: 110, text: "Hãy biến chướng ngại vật thành cơ hội để rèn luyện và thành công!" }
  ];

  let currentTime = 0;
  let isPlaying = true;
  let lastTimestamp = null;
  let currentSceneIndex = 0;

  const progressBar = document.getElementById('progress-bar');
  const timerDisplay = document.getElementById('timer');
  const sceneTag = document.getElementById('scene-tag');
  const captionText = document.getElementById('caption-text');
  const btnPlay = document.getElementById('btn-play');
  const btnReplay = document.getElementById('btn-replay');

  function updateTimeline(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    if (isPlaying) {
      currentTime += delta;
      if (currentTime >= TOTAL_TIME) {
        currentTime = TOTAL_TIME;
        isPlaying = false;
        btnPlay.textContent = '▶ Tiếp tục';
      }
    }

    progressBar.style.width = `${(currentTime / TOTAL_TIME) * 100}%`;
    timerDisplay.textContent = `${currentTime.toFixed(1)}s / ${TOTAL_TIME}.0s`;

    let activeIdx = 0;
    for (let i = scenes.length - 1; i >= 0; i--) {
      if (currentTime >= scenes[i].start) {
        activeIdx = i;
        break;
      }
    }

    if (activeIdx !== currentSceneIndex || currentTime === 0) {
      document.querySelectorAll('.scene').forEach((el, idx) => {
        el.classList.toggle('active', idx === activeIdx);
      });
      currentSceneIndex = activeIdx;
      sceneTag.textContent = `Cảnh ${activeIdx + 1}/${scenes.length}`;
      captionText.textContent = scenes[activeIdx].text;
    }

    requestAnimationFrame(updateTimeline);
  }

  btnPlay.addEventListener('click', () => {
    isPlaying = !isPlaying;
    btnPlay.textContent = isPlaying ? '⏸ Tạm dừng' : '▶ Tiếp tục';
    lastTimestamp = performance.now();
  });

  btnReplay.addEventListener('click', () => {
    currentTime = 0;
    isPlaying = true;
    btnPlay.textContent = '⏸ Tạm dừng';
    lastTimestamp = performance.now();
  });

  requestAnimationFrame(updateTimeline);
</script>
</body>
</html>
