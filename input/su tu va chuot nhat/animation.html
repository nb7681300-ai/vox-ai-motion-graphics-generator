<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sư Tử và Chuột Nhắt - Hoạt Hình Người Que Flat Vector</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --frame-bg: #1e293b;
      --sky-day: #bae6fd;
      --sky-warm: #fef08a;
      --grass-green: #4ade80;
      --grass-dark: #16a34a;
      --tree-trunk: #78350f;
      --lion-body: #f59e0b;
      --lion-mane: #b45309;
      --mouse-color: #9ca3af;
      --net-color: #f87171;
      --accent: #f43f5e;
      --text-white: #f8fafc;
      --card-bg: rgba(15, 23, 42, 0.85);
    }

    /* Font gia đình chuẩn tiếng Việt - Tuyệt đối không dùng Trebuchet MS */
    html, body, svg, text {
      font-family: 'Segoe UI', 'Arial', 'Helvetica Neue', 'Noto Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #stage-wrap {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    #frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border: 4px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    #topbar {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #scene-tag {
      background: var(--card-bg);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }

    #progress-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.1s linear;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #caption {
      position: absolute;
      bottom: 16px;
      left: 20px;
      right: 20px;
      z-index: 20;
      text-align: center;
    }

    #caption-text {
      display: inline-block;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.4;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1e293b;
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid #334155;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    #timer {
      font-family: monospace;
      font-size: 14px;
      color: #94a3b8;
    }

    /* ==========================================
       CSS ANIMATIONS (Quy tắc tên: [nhân vật]-[hành động])
       ========================================== */
    
    /* Cảnh 1: Thở & Zzz */
    .lion-breathe {
      animation: lion-breathe-anim 2s infinite ease-in-out;
      transform-origin: 320px 280px;
    }
    @keyframes lion-breathe-anim {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03, 0.98); }
    }

    .zzz1 { animation: zzz-anim 2.5s infinite linear; animation-delay: 0s; }
    .zzz2 { animation: zzz-anim 2.5s infinite linear; animation-delay: 0.8s; }
    .zzz3 { animation: zzz-anim 2.5s infinite linear; animation-delay: 1.6s; }
    @keyframes zzz-anim {
      0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translate(30px, -40px) scale(1.2); }
    }

    /* Cảnh 2: Chạy & Rung sợ */
    .mouse-run-scene2 {
      animation: mouse-run-anim 3s forwards ease-out;
    }
    @keyframes mouse-run-anim {
      0% { transform: translateX(0px); }
      50% { transform: translateX(180px); }
      100% { transform: translateX(230px) translateY(-50px); }
    }

    .mouse-shake {
      animation: shake-anim 0.2s infinite;
      transform-origin: center;
    }
    @keyframes shake-anim {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    /* Cảnh 3: Chuột van xin */
    .mouse-beg {
      animation: beg-anim 0.6s infinite alternate ease-in-out;
      transform-origin: 360px 240px;
    }
    @keyframes beg-anim {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(-10deg); }
    }

    /* Cảnh 4: Cười & Tha */
    .lion-laugh {
      animation: laugh-anim 0.4s infinite alternate ease-in-out;
      transform-origin: 300px 220px;
    }
    @keyframes laugh-anim {
      0% { transform: scale(1); }
      100% { transform: scale(1.05, 0.95) rotate(2deg); }
    }

    .mouse-flee {
      animation: flee-anim 2s forwards ease-in 2s;
    }
    @keyframes flee-anim {
      0% { transform: translateX(0); }
      100% { transform: translateX(350px); }
    }

    /* Cảnh 5: Bẫy sập & Giãy giụa */
    .net-drop {
      animation: net-drop-anim 1s forwards ease-bounce;
    }
    @keyframes net-drop-anim {
      0% { transform: translateY(-200px); }
      100% { transform: translateY(0); }
    }

    .lion-struggle {
      animation: struggle-anim 0.5s infinite alternate ease-in-out;
      transform-origin: 400px 260px;
    }
    @keyframes struggle-anim {
      0% { transform: rotate(-3deg) scale(0.98); }
      100% { transform: rotate(3deg) scale(1.02); }
    }

    /* Cảnh 6: Cắn lưới */
    .mouse-gnaw {
      animation: gnaw-anim 0.3s infinite alternate ease-in-out;
      transform-origin: 340px 270px;
    }
    @keyframes gnaw-anim {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(12deg); }
    }

    .net-break {
      animation: net-break-anim 1s forwards 4s;
    }
    @keyframes net-break-anim {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.2; transform: scale(1.2) translateY(30px); }
    }

    /* Cảnh 7: Kết & Vẫy tay */
    .sun-glow {
      animation: sun-anim 4s infinite alternate ease-in-out;
      transform-origin: 400px 80px;
    }
    @keyframes sun-anim {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .hand-wave {
      animation: wave-anim 0.8s infinite alternate ease-in-out;
      transform-origin: bottom center;
    }
    @keyframes wave-anim {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(20deg); }
    }

    .message-card {
      animation: card-appear 1.2s forwards ease-out 1s;
      opacity: 0;
      transform: scale(0.8);
      transform-origin: center;
    }
    @keyframes card-appear {
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

  <script>
    // Dữ liệu mảng 7 cảnh khớp đúng content.md và tổng thời lượng TOTAL = 60s
    const TOTAL = 60;
    const scenes = [
      { id: 1, start: 0,  text: "Trong một khu rừng xanh tươi, Sư Tử chúa tể đang tận hưởng giấc ngủ trưa yên bình." },
      { id: 2, start: 8,  text: "Bất ngờ, Chuột Nhắt vô tình chạy qua và làm phiền giấc ngủ của Sư Tử. Sư Tử nổi giận vơ lấy Chuột!" },
      { id: 3, start: 16, text: "Chuột Nhắt sợ hãi xin tha: \"Xin Bệ hạ tha cho tôi! Biết đâu sau này tôi sẽ giúp được Bệ hạ!\"" },
      { id: 4, start: 25, text: "Sư Tử cười lớn vì thấy vô lý, nhưng vốn rộng lượng, Sư Tử đã tha cho Chuột Nhắt đi." },
      { id: 5, start: 33, text: "Vài ngày sau, Sư Tử vô tình sập bẫy thợ săn. Bị vướng chặt trong lưới, nó gầm lên bất lực." },
      { id: 6, start: 42, text: "Nghe tiếng kêu, Chuột Nhắt lao tới. Bằng hàm răng sắc nhọn, Chuột cắn đứt từng mắt lưới cứu Sư Tử." },
      { id: 7, start: 51, text: "Sư Tử vô cùng biết ơn. Từ đó, họ trở thành bạn tốt. Bạn thấy đấy, dù nhỏ bé, ai cũng có thể giúp đỡ người khác!" }
    ];

    let startTime = null;
    let pausedTime = 0;
    let isPaused = false;
    let animationFrameId = null;
    let lastSceneId = -1;

    const elProgressBar = document.getElementById('progress-bar');
    const elSceneTag = document.getElementById('scene-tag');
    const elCaptionText = document.getElementById('caption-text');
    const elTimer = document.getElementById('timer');
    const btnPlayPause = document.getElementById('btn-playpause');
    const btnReplay = document.getElementById('btn-replay');

    function getCurrentSceneIndex(elapsed) {
      for (let i = scenes.length - 1; i >= 0; i--) {
        if (elapsed >= scenes[i].start) return i;
      }
      return 0;
    }

    function activateScene(sceneIndex) {
      const sceneData = scenes[sceneIndex];
      if (sceneData.id === lastSceneId) return;

      lastSceneId = sceneData.id;

      // Cập nhật DOM Active
      document.querySelectorAll('.scene').forEach((el, idx) => {
        if (idx === sceneIndex) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      // Cập nhật văn bản
      elSceneTag.textContent = `Cảnh ${sceneData.id}/${scenes.length}`;
      elCaptionText.textContent = sceneData.text;
    }

    function tick(timestamp) {
      if (!startTime) startTime = timestamp;

      if (!isPaused) {
        const elapsed = (timestamp - startTime - pausedTime) / 1000;
        const currentClamped = Math.min(elapsed, TOTAL);

        // Cập nhật thanh tiến trình & đồng hồ
        const progressPercent = (currentClamped / TOTAL) * 100;
        elProgressBar.style.width = `${progressPercent}%`;
        elTimer.textContent = `${currentClamped.toFixed(1)}s / ${TOTAL}s`;

        // Kích hoạt Cảnh
        const currentIndex = getCurrentSceneIndex(currentClamped);
        activateScene(currentIndex);

        if (elapsed < TOTAL) {
          animationFrameId = requestAnimationFrame(tick);
        } else {
          // Kết thúc
          elTimer.textContent = `${TOTAL}.0s / ${TOTAL}s`;
        }
      }
    }

    function play() {
      isPaused = false;
      btnPlayPause.textContent = "⏸ Tạm dừng";
      let pauseDuration = 0;
      if (this.pauseStart) {
        pauseDuration = performance.now() - this.pauseStart;
        pausedTime += pauseDuration;
        this.pauseStart = null;
      }
      animationFrameId = requestAnimationFrame(tick);
    }

    function pause() {
      isPaused = true;
      btnPlayPause.textContent = "▶ Tiếp tục";
      this.pauseStart = performance.now();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    btnPlayPause.addEventListener('click', () => {
      if (isPaused) {
        play();
      } else {
        pause();
      }
    });

    btnReplay.addEventListener('click', () => {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      startTime = null;
      pausedTime = 0;
      lastSceneId = -1;
      isPaused = false;
      btnPlayPause.textContent = "⏸ Tạm dừng";
      animationFrameId = requestAnimationFrame(tick);
    });

    // Chạy tự động ngay khi mở file
    animationFrameId = requestAnimationFrame(tick);
  </script>
</body>
</html>
